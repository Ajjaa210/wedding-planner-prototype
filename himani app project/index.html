<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta
      name="description"
      content="Shaadikipanchayat is a wedding vendor discovery and planning prototype."
    />
    <title>Shaadikipanchayat — plan together</title>
    <link rel="stylesheet" href="./styles.css?v=6" />
    <script src="./app.js?v=6" defer></script>
  </head>
  <body>
    <div class="prototype-banner">
      <span class="banner-dot" aria-hidden="true"></span>
      Prototype only · Example vendor profiles are fictional and unverified
    </div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-nav="home" aria-label="Shaadikipanchayat home">
          <span class="brand-mark" aria-hidden="true">श</span>
          <span class="brand-name">shaadi<span>ki</span>panchayat</span>
        </a>
        <p class="side-label">YOUR SPACE</p>
        <nav class="side-nav">
          <button class="nav-item active" data-nav="home"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-item" data-nav="discover"><span class="nav-icon">⌕</span>Find vendors</button>
          <button class="nav-item" data-nav="match" data-v2-only><span class="nav-icon">✦</span>Find your match</button>
          <button class="nav-item" data-nav="shortlist"><span class="nav-icon">♡</span>My shortlist <span class="nav-count" id="shortlist-count">0</span></button>
          <button class="nav-item" data-nav="planner"><span class="nav-icon">☷</span>Planning board</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card">
            <span class="help-sparkle" aria-hidden="true">✳</span>
            <strong>Planning is a team effort.</strong>
            <p>Save ideas as you go. You can decide together, at your own pace.</p>
          </div>
          <div class="profile-chip">
            <span class="avatar">HM</span>
            <span><strong>Your workspace</strong><small>Private prototype</small></span>
            <span class="profile-menu" aria-hidden="true">···</span>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-sep">/</span><strong id="page-crumb">Overview</strong></div>
          <div class="top-actions">
            <div class="version-switch" role="group" aria-label="Choose prototype version">
              <button data-version="v1" aria-pressed="false">V1</button>
              <button data-version="v2" class="selected" aria-pressed="true">V2</button>
            </div>
            <button class="icon-button notification-button" aria-label="Prototype information" data-action="prototype-info">i</button>
            <span class="avatar top-avatar" aria-label="Himani Mittal">HM</span>
          </div>
        </header>

        <div class="content" id="app-content" tabindex="-1"></div>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
